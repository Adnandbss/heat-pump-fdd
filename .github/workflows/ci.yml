name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: OpenAPI contract is committed
        run: |
          python tools/export_openapi.py
          git diff --exit-code web/openapi.json \
            || (echo "::error::web/openapi.json is stale — run 'make openapi' and commit" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          npx playwright install --with-deps chromium
      - name: Playwright evidence page
        run: npm run test:e2e
        env:
          CI: true
