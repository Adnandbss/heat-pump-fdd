services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      FDD_API_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
