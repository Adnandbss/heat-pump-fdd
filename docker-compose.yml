services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./web
      args:
        # Browser origin, not the Docker DNS name `api`.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
